import * as THREE from 'three';

// Наборы для просмотра: ?set=humans | actions | animals | build1 | build2 | build3 | amphi | ships | small | nature | poi1 | poi2 | trade | dungeon | glad
const params = new URLSearchParams(location.search);
const SET = params.get('set') || 'humans';
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(1);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(SET === 'dungeon' ? 0x1a1814 : 0x9cc4e4);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.05, 2000);
scene.add(new THREE.HemisphereLight(0xdfefff, 0x8a7a5a, SET === 'dungeon' ? 0.35 : 1.1));

sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0004;
scene.add(sun, sun.target);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(4000, 4000), new THREE.MeshStandardMaterial({ color: SET === 'ships' ? 0x2d7f9a : 0xb8a676, roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
if (SET === 'ships') ground.position.y = -0.02;

// окружение как в игре (иначе металлы выглядят чёрными)
{
  const envScene = new THREE.Scene();
  const sg = new THREE.SphereGeometry(10, 32, 16); const cols = []; const pa = sg.attributes.position;
  for (let i = 0; i < pa.count; i++) { const k = Math.max(0, pa.getY(i) / 10); const c = new THREE.Color(0xb8a888).lerp(new THREE.Color(0x8ab8e8), Math.min(1, k * 2 + 0.3)); cols.push(c.r, c.g, c.b); }
  sg.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  envScene.add(new THREE.Mesh(sg, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide })));
  const pm = new THREE.PMREMGenerator(renderer); scene.environment = pm.fromScene(envScene, 0.02).texture; scene.environmentIntensity = 0.4;
}
const items = [];   // { obj, name, x, z, tris }
const tri = (o) => { let n = 0; o.traverseVisible((c) => { if (c.isMesh && c.geometry) { const g = c.geometry; const t = (g.index ? g.index.count : g.attributes.position.count) / 3; n += t * (c.isInstancedMesh ? c.count : 1); } }); return Math.round(n); };
function place(obj, name, x, z, ry = 0) { obj.position.x += x; obj.position.z += z; obj.rotation.y += ry; scene.add(obj); items.push({ obj, name, x, z, tris: tri(obj) }); return obj; }
function grid(list, cols, dx, dz, ry = 0) { list.forEach(([name, mk], i) => { let o; try { o = mk(); } catch (e) { console.error('model ' + name + ': ' + e.stack); return; } place(o, name, (i % cols - (cols - 1) / 2) * dx, Math.floor(i / cols) * dz, ry); }); }

  const s = { speed: 0, ...(anim || {}) };
  for (let i = 0; i < (anim && anim.frames || 30); i++) MD.animateHuman(h, 1 / 30, { ...s, t: i / 30 });
  return h;
};

      3: [['walk 1.4', H(LEG, {}, { speed: 1.4, frames: 23 })], ['walk 5.2', H({ weapon: 'gladius' }, {}, { speed: 5.2, frames: 17 })], ['run 8.6', H({ weapon: 'hasta' }, {}, { speed: 8.6, running: true, frames: 19 })], ['swim', H({}, {}, { swim: true, frames: 60 })], ['dead', H({ weapon: 'gladius' }, {}, { dead: 1, frames: 40 })]],
    };
    grid(sets[which], 5, 1.5, 0, +(params.get('ry') || 0));

  }
  case 'zoo': {

      : n === '1' ? [['bear', A('bear', 1.5)], ['bear attack', A('bear', 0, 10, { attack: 0.5 })], ['lion', A('lion', 4)], ['horse trot', A('horse', 3.5)]]

    camPos.set(0, n === '2' ? 3.5 : 2.2, n === '2' ? 15 : 9.5); camLook.set(0, 0.8, 0);

  }
  case 'look': {

    for (const k of (params.get('p') || '').split(',').filter(Boolean)) mk.push([k, () => MD.makePOI(k)]);
    for (const k of (params.get('a') || '').split(',').filter(Boolean)) mk.push([k, A(k, +(params.get('sp') || 0), 25)]);
    let x = 0;

    items.forEach((it) => { it.obj.position.x -= x / 2; it.x -= x / 2; });
    const bb0 = new THREE.Box3(); items.forEach((it) => bb0.expandByObject(it.obj));

    ], 4, 4.5, 4.5, -0.6);

    break;
  }
  case 'build1': grid(['forum', 'horreum', 'fabrica', 'ferraria', 'pistrinum', 'macellum'].map((k) => [k, () => MD.makeBuilding(k, { level: 2 })]), 3, 32, 32); camPos.set(0, 60, 82); camLook.set(0, 0, 16); break;
  case 'build2': grid(['portus', 'castra', 'thermae', 'taberna', 'templum', 'turris', 'murus', 'pharos'].map((k) => [k, () => MD.makeBuilding(k)]), 4, 30, 32); camPos.set(0, 58, 80); camLook.set(0, 0, 14); break;
  case 'build3': grid(['domus', 'farm', 'olivetum', 'vinea', 'lumber', 'figlina', 'fishery', 'pecus', 'linarium', 'colonia'].map((k) => [k, () => MD.makeBuilding(k)]), 5, 21, 22); camPos.set(0, 42, 58); camLook.set(0, 0, 10); break;
  case 'amphi': place(MD.makeBuilding('amphitheatrum'), 'amphitheatrum', 0, 0); camPos.set(55, 60, 75); camLook.set(0, 0, 0); break;
  case 'scaffold': grid([0, 0.25, 0.5, 0.8].map((p) => ['forum ' + p, () => MD.makeScaffold('forum', 12, p)]).concat([['domus .5', () => MD.makeScaffold('domus', 6, 0.5)]]), 5, 22, 22); camPos.set(0, 28, 42); camLook.set(0, 0, 0); break;
  case 'ships': grid(['scapha', 'corbita', 'liburna', 'trireme', 'pirate_ship', 'punic_ship'].map((k) => [k, () => { const s = MD.makeShip(k); MD.animateShip(s, 1.3, 4); return s; }]), 3, 14, 32, -0.5); camPos.set(-10, 26, 58); camLook.set(0, 0, 14); break;

      place(safe('sea_wreck', () => MD.makePOI('sea_wreck')), 'sea_wreck', 8, 46);
      camPos.set(-6, 55, 95); camLook.set(-4, 0, 16);
    }
    break;
  }
  case 'glad': {   // школа гладиаторов, зверинец, сдающиеся на коленях (n=1 — крупно люди)
    const n = params.get('n') || '0';
    const KN = [
      ['barbarian kneel', H({ weapon: 'axe', offhand: 'barbshield', body: 'fur' }, { tunic: 0x6a5a3a, hair: 0x8a5a2a }, { kneel: true, frames: 60 })],
      ['legionary kneel', H(LEG, {}, { kneel: true, frames: 60 })],
      ['gladiator kneel', H({ weapon: 'gladius', body: 'glad', head: 'murmillo', offhand: 'scutum' }, {}, { kneel: true, frames: 60 })],
      ['unarmed kneel', H({}, { tunic: 0x8a7a5a }, { kneel: true, frames: 60 })],
      ['kneel→stand', H({ weapon: 'gladius' }, {}, { kneel: true, frames: 6 })],
    ];
    if (n === '1') {
      grid(KN, 5, 1.9, 0, +(params.get('ry') || 0.5));
      camPos.set(+(params.get('cx') || 0), 2.2, 9.5); camLook.set(0, 0.5, 0);
    } else if (n === '2' || n === '3') {   // крупные планы: клетка со львом / портик с кельями
      const v = n === '2';
      place(MD.makeBuilding(v ? 'vivarium' : 'ludus'), v ? 'vivarium' : 'ludus', 0, 0);
      if (v) { camPos.set(1.5, 2.6, 2.2); camLook.set(-0.2, 0.5, -4.4); } else { camPos.set(3, 3.2, 3.5); camLook.set(-1, 2.2, -4.5); }
      if (params.get('cam')) camPos.set(...params.get('cam').split(',').map(Number));
      if (params.get('at')) camLook.set(...params.get('at').split(',').map(Number));
    } else {
      place(MD.makeBuilding('ludus'), 'ludus', -10, 0);
      place(MD.makeBuilding('vivarium'), 'vivarium', 10, 0);
      grid(KN.slice(0, 3), 3, 1.6, 0); items.slice(-3).forEach((it) => { it.obj.position.z += 11; it.z += 11; });
      camPos.set(0, 24, 34); camLook.set(0, 0, 1);
    }
    break;
  }
  case 'city': place(MD.makePOI('port_city'), 'port_city', 0, 0); camPos.set(0, 50, 170); camLook.set(0, 10, -20); break;
  case 'dungeon': {
    const th = ['cave', 'mine', 'tomb', 'fortress'];
    th.forEach((t, i) => { const r = MD.makeDungeonRoom(t, 14, 12, ['s', 'e']); place(r, 'room ' + t, (i % 2 - 0.5) * 22, Math.floor(i / 2) * 20); });
    th.forEach((t, i) => { const c = MD.makeDungeonCorridor(t, 10); place(c, 'corr ' + t, 24 + i * 7, 10); });
    camPos.set(10, 40, 46); camLook.set(6, 0, 10);
    break;
  }
}
// виртуальные источники → настоящие точечные лампы (не больше 16)
let nl = 0;
for (const v of MD.VLIGHTS) { let r = v; while (r.parent) r = r.parent; if (r !== scene || nl >= 16) continue; const l = new THREE.PointLight(v.color, v.intensity * (SET === 'dungeon' ? 1.2 : 0.6), v.distance, v.decay); v.add(l); nl++; }
// тень от солнца под набор
const bb = new THREE.Box3(); items.forEach((it) => bb.expandByObject(it.obj));
const c = bb.getCenter(new THREE.Vector3()), sz = bb.getSize(new THREE.Vector3()).length();
sun.position.set(c.x + sz * 0.4, sz * 0.8 + 10, c.z + sz * 0.5); sun.target.position.copy(c);
const sc = sun.shadow.camera; sc.left = sc.bottom = -sz * 0.6; sc.right = sc.top = sz * 0.6; sc.near = 1; sc.far = sz * 3 + 50; sc.updateProjectionMatrix();
camera.position.copy(camPos); camera.lookAt(camLook);
renderer.render(scene, camera);
// подписи
const lbl = document.getElementById('lbl'); const v = new THREE.Vector3();
for (const it of items) { v.set(it.obj.position.x, 0, it.obj.position.z).project(camera); const d = document.createElement('div'); d.textContent = `${it.name} · ${it.tris}`; d.style.left = ((v.x + 1) / 2 * innerWidth) + 'px'; d.style.top = ((1 - v.y) / 2 * innerHeight + 4) + 'px'; lbl.appendChild(d); }
document.getElementById('info').textContent = `${SET}: ${items.length} моделей, кадр: ${renderer.info.render.triangles} треуг., ${renderer.info.render.calls} вызовов`;
window.__tris = items.map((it) => ({ name: it.name, tris: it.tris }));
window.__done = true;
</script>
